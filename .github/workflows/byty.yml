name: Hledání bytů

on:
  schedule:
    - cron: "7,37 * * * *"   # každých 30 minut (GitHub plánované běhy občas zpozdí)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: byty
  cancel-in-progress: false

jobs:
  hledej:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Databáze a data webu žijí ve větvi "data" (jen poslední verze, bez historie),
      # aby se repo nenafukovalo binárkou při každém běhu.
      - name: Načíst data
        run: |
          if git fetch --depth=1 origin data; then
            git show origin/data:byty.db > byty.db
            git show origin/data:byty.json > web/byty.json
            git show origin/data:hlidani.json > hlidani.json 2>/dev/null || rm -f hlidani.json
          fi
      - name: Stáhnout byty
        if: github.event_name != 'push'
        run: python -X utf8 hledej_byty.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Uložit data
        if: github.event_name != 'push'
        run: |
          d=$(mktemp -d)
          cp byty.db web/byty.json "$d"
          if [ -f hlidani.json ]; then cp hlidani.json "$d"; fi
          cd "$d"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data $(date '+%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
