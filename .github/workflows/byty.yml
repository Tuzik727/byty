name: Hledání bytů

on:
  schedule:
    - cron: "17 4,7,10,13,16,19 * * *"   # UTC = 6–21 h českého času, každé 3 hodiny
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/index.html"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: byty
  cancel-in-progress: false

jobs:
  hledej:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stáhnout byty
        if: github.event_name != 'push'
        run: python -X utf8 hledej_byty.py
      - name: Uložit databázi
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add byty.db web/byty.json
          git diff --cached --quiet || git commit -m "Aktualizace bytů $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
